<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omni-Search · StudyWork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f9fa;--card:#fff;--bd:#dadce0;--tx:#202124;--tx2:#5f6368;--blue:#1a73e8;--tb:#e8f0fe;--tbt:#1967d2;--nb:#fef7e0;--nbt:#b06000;--eb:#e6f4ea;--ebt:#137333;--rb:#f3e8fd;--rbt:#7b1fa2;--sh:0 12px 40px rgba(32,33,36,.24);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--tb:#283142;--tbt:#8ab4f8;--nb:#3d3520;--nbt:#fdd663;--eb:#25332a;--ebt:#81c995;--rb:#332942;--rbt:#d7aefb;--sh:0 12px 40px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--tb:#283142;--tbt:#8ab4f8;--nb:#3d3520;--nbt:#fdd663;--eb:#25332a;--ebt:#81c995;--rb:#332942;--rbt:#d7aefb;--sh:0 12px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Roboto,Arial,sans-serif;display:flex;align-items:flex-start;justify-content:center}
button,input{font:inherit;color:inherit}
/* fake page behind, just to show it's an overlay */
.page{position:fixed;inset:0;padding:20px 24px}
.page h1{font-size:20px;color:var(--tx2);opacity:.5}
.hint{position:fixed;left:24px;bottom:20px;font-size:12.5px;color:var(--tx2)}
.hint kbd{border:1px solid var(--bd);border-radius:5px;padding:1px 6px;background:var(--card)}
/* overlay */
.backdrop{position:fixed;inset:0;background:rgba(32,33,36,.5);backdrop-filter:blur(3px);display:flex;justify-content:center;padding-top:12vh;z-index:10}
.dlg{width:640px;max-width:calc(100% - 32px);max-height:70vh;background:var(--card);border-radius:16px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
.sb{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd)}
.sb input{flex:1;border:0;outline:0;background:transparent;font-size:16px}
.sb kbd{font-size:11px;color:var(--tx2);border:1px solid var(--bd);border-radius:5px;padding:2px 7px;background:var(--bg)}
.chips{display:flex;gap:7px;padding:10px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:99px;padding:5px 13px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.chip.on{background:var(--tb);border-color:var(--tb);color:var(--tbt);font-weight:600}
.res{flex:1;overflow-y:auto;padding:8px}
.grp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);padding:12px 12px 6px}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
.row:hover,.row.sel{background:var(--bg)}
.ic{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:13.5px;font-weight:500}
.row span{font-size:12px;color:var(--tx2)}
.kret{flex:none;font-size:11px;color:var(--tx2);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;opacity:0}
.row:hover .kret,.row.sel .kret{opacity:1}
.foot{display:flex;gap:16px;padding:9px 18px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx2)}
.foot span{display:flex;align-items:center;gap:5px}
</style></head>
<body>
<div class="page"><h1>StudyWork</h1></div>
<div class="hint">Nhấn <kbd>Ctrl</kbd> + <kbd>K</kbd> để mở lại bảng lệnh</div>

<div class="backdrop" id="bd">
  <div class="dlg">
    <div class="sb">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" placeholder="Tìm kiếm bài học, việc cần làm, tài liệu, hoặc nhập lệnh..." autofocus>
      <kbd>ESC</kbd>
    </div>
    <div class="chips">
      <button class="chip on" data-f="all">Tất cả</button>
      <button class="chip" data-f="space">🎓 Đồ án</button>
      <button class="chip" data-f="note">📝 Ghi chú</button>
      <button class="chip" data-f="task">☑️ Nhiệm vụ</button>
    </div>
    <div class="res" id="res"></div>
    <div class="foot"><span>↑↓ chọn</span><span>↵ mở</span><span>ESC đóng</span></div>
  </div>
</div>

<script>
(function(){
var RECENT=[
 {t:'note',icon:'📝',bg:'var(--nb)',lb:'Ghi chú góp ý Thầy Cường',s:'🎓 Đồ án tốt nghiệp · sửa 2 giờ trước'},
 {t:'task',icon:'☑️',bg:'var(--tb)',lb:'Hoàn thiện Prisma Schema',s:'🎓 Đồ án tốt nghiệp · HIGH · 28/09'},
 {t:'space',icon:'🎓',bg:'var(--eb)',lb:'Đồ án tốt nghiệp',s:'Không gian · 65% tiến độ'}
];
var CMDS=[
 {icon:'⚡',lb:'Tạo ghi chú mới',s:'Lệnh nhanh'},
 {icon:'⚡',lb:'Mở bảng Kanban',s:'Lệnh nhanh'},
 {icon:'⚡',lb:'Bật chế độ Zen Focus',s:'Phím tắt F'},
 {icon:'⚡',lb:'Tạo việc cần làm mới',s:'Lệnh nhanh'}
];
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var res=$('#res'),q=$('#q'),bd=$('#bd');
function row(x,cmd){
 return '<div class="row" tabindex="0"><div class="ic" style="background:'+(cmd?'var(--tb)':x.bg)+'">'+(cmd?x.icon:x.icon)+'</div><div class="t"><b>'+x.lb+'</b><span>'+x.s+'</span></div><span class="kret">↵</span></div>';
}
function render(term){
 term=(term||'').trim().toLowerCase();
 var rec=RECENT.filter(function(x){return x.lb.toLowerCase().indexOf(term)>-1});
 var cmd=CMDS.filter(function(x){return x.lb.toLowerCase().indexOf(term)>-1});
 var h='';
 if(rec.length)h+='<div class="grp">Xem gần đây</div>'+rec.map(function(x){return row(x)}).join('');
 if(cmd.length)h+='<div class="grp">Lệnh nhanh</div>'+cmd.map(function(x){return row(x,true)}).join('');
 if(!rec.length&&!cmd.length)h='<div style="padding:28px;text-align:center;color:var(--tx2);font-size:13px">Không tìm thấy kết quả cho "'+term+'"</div>';
 res.innerHTML=h;
 var rows=$$('.row',res);if(rows[0])rows[0].classList.add('sel');
 idx=0;
}
var idx=0;
function move(d){var rows=$$('.row',res);if(!rows.length)return;rows[idx]&&rows[idx].classList.remove('sel');idx=(idx+d+rows.length)%rows.length;rows[idx].classList.add('sel');rows[idx].scrollIntoView({block:'nearest'})}
q.oninput=function(){render(q.value)};
res.addEventListener('click',function(e){var r=e.target.closest('.row');if(r){bd.style.display='none'}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){bd.style.display='none';return}
 if(e.key==='ArrowDown'){e.preventDefault();move(1)}
 if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
 if(e.key==='Enter'){var s=$('.row.sel',res);if(s)bd.style.display='none'}
 if((e.key==='k'||e.key==='K')&&(e.ctrlKey||e.metaKey)){e.preventDefault();bd.style.display='flex';q.focus()}
});
$$('.chip').forEach(function(c){c.onclick=function(){$$('.chip').forEach(function(x){x.classList.remove('on')});c.classList.add('on');render(q.value)}});
render('');
})();
</script>
</body></html>
