<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập · StudyWork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f9fa;--card:#fff;--bd:#dadce0;--tx:#202124;--tx2:#5f6368;--blue:#1a73e8;--blueh:#1557b0;--tb:#e8f0fe;--sh:0 1px 2px rgba(60,64,67,.12),0 2px 8px rgba(60,64,67,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blueh:#aecbfa;--tb:#283142;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blueh:#aecbfa;--tb:#283142;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 16px}
button,input{font:inherit;color:inherit}
.card{width:440px;max-width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:36px 36px 28px}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:17px;margin-bottom:24px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
h1{margin:0 0 22px;font-size:19px;font-weight:600;text-align:center}
.g{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--bd);background:var(--card);border-radius:8px;height:42px;font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:18px}
.g:hover{background:var(--bg)}
.div{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:12px;margin-bottom:18px}
.div:before,.div:after{content:"";flex:1;height:1px;background:var(--bd)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.iw{position:relative}
.field input{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--bg);outline:0;font-size:14px}
.field input:focus{border-color:var(--blue);background:var(--card);box-shadow:0 0 0 3px var(--tb)}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--tx2);cursor:pointer;padding:2px}
.row2{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;font-size:12.5px}
.rem{display:flex;align-items:center;gap:7px;color:var(--tx2)}
.rem input{accent-color:var(--blue);width:14px;height:14px}
.fp{color:var(--blue);text-decoration:none;font-weight:500}
.fp:hover{text-decoration:underline}
.submit{width:100%;border:0;background:var(--blue);color:#fff;border-radius:8px;height:42px;font-weight:600;font-size:14px;cursor:pointer}
:root[data-theme="dark"] .submit{color:#202124}
.submit:hover{background:var(--blueh)}
.foot{text-align:center;font-size:13px;color:var(--tx2);margin-top:22px}
.foot a{color:var(--blue);font-weight:500;text-decoration:none}
.foot a:hover{text-decoration:underline}
</style></head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span>StudyWork</div>
  <h1>Đăng nhập tài khoản</h1>
  <button class="g"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10.1-2 13.7-5.2l-6.3-5.3C29.4 35.4 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.3 5.3C40.9 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>Tiếp tục với Google</button>
  <div class="div">hoặc</div>
  <div class="field"><label>Email</label><input type="email" placeholder="ban@email.com" value="hoan.vk@studywork.dev"></div>
  <div class="field"><label>Mật khẩu</label><div class="iw"><input id="pw" type="password" placeholder="••••••••" value="matkhau123"><button class="eye" id="eye" aria-label="Hiện mật khẩu">👁️</button></div></div>
  <div class="row2"><label class="rem"><input type="checkbox" checked>Ghi nhớ đăng nhập</label><a href="#" class="fp">Quên mật khẩu?</a></div>
  <button class="submit">Đăng nhập</button>
  <div class="foot">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></div>
</div>
<script>
document.getElementById('eye').onclick=function(){var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'};
</script>
</body></html>
