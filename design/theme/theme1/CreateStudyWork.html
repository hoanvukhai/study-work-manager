<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo nhanh · StudyWork</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f9fa;--card:#fff;--bd:#dadce0;--tx:#202124;--tx2:#5f6368;--blue:#1a73e8;--blueh:#1557b0;--tb:#e8f0fe;--tbt:#1967d2;--nb:#fef7e0;--nbt:#b06000;--eb:#e6f4ea;--ebt:#137333;--rb:#f3e8fd;--rbt:#7b1fa2;--ub:#fce8e6;--ubt:#c5221f;--sh:0 12px 40px rgba(32,33,36,.24);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blueh:#aecbfa;--tb:#283142;--tbt:#8ab4f8;--nb:#3d3520;--nbt:#fdd663;--eb:#25332a;--ebt:#81c995;--rb:#332942;--rbt:#d7aefb;--ub:#42282a;--ubt:#f28b82;--sh:0 12px 40px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#202124;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blueh:#aecbfa;--tb:#283142;--tbt:#8ab4f8;--nb:#3d3520;--nbt:#fdd663;--eb:#25332a;--ebt:#81c995;--rb:#332942;--rbt:#d7aefb;--ub:#42282a;--ubt:#f28b82;--sh:0 12px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.page{padding:20px 24px;color:var(--tx2)}
.hint{position:fixed;left:24px;bottom:20px;font-size:12.5px;color:var(--tx2)}
.hint kbd{border:1px solid var(--bd);border-radius:5px;padding:1px 6px;background:var(--card)}
.backdrop{position:fixed;inset:0;background:rgba(32,33,36,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:10}
.dlg{width:520px;max-width:calc(100% - 32px);background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.dh{padding:16px 20px 0}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(60,64,67,.15)}
.body{padding:0 20px}
.title{width:100%;border:0;outline:0;font-size:17px;font-weight:600;padding:6px 0 14px;background:transparent}
.title::placeholder{color:#9aa0a6;font-weight:500}
.row{display:flex;gap:10px;margin-bottom:12px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--bg);outline:0}
.field input:focus,.field select:focus{border-color:var(--blue);background:var(--card);box-shadow:0 0 0 3px var(--tb)}
.pr{display:flex;gap:6px}
.pr button{flex:1;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx2)}
.pr button.on{color:#fff;border-color:transparent}
.pr button[data-p="LOW"].on{background:#80868b}
.pr button[data-p="MEDIUM"].on{background:var(--blue)}
.pr button[data-p="HIGH"].on{background:var(--nbt)}
.pr button[data-p="URGENT"].on{background:var(--ubt)}
.urlprev{display:none;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:12px;background:var(--bg)}
.urlprev.show{display:flex}
.urlprev .ic{width:32px;height:32px;border-radius:8px;background:var(--rb);color:var(--rbt);display:grid;place-items:center;flex:none}
.urlprev b{display:block;font-size:13px}.urlprev span{font-size:11.5px;color:var(--tx2)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--bd);margin-top:6px}
.hintf{font-size:12px;color:var(--tx2)}
.hintf kbd{border:1px solid var(--bd);border-radius:5px;padding:1px 6px;background:var(--bg)}
.acts{display:flex;gap:8px}
.cancel{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;color:var(--tx)}
.save{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer}
:root[data-theme="dark"] .save{color:#202124}
.save:hover{background:var(--blueh)}
</style></head>
<body>
<div class="page">StudyWork</div>
<div class="hint">Nhấn <kbd>C</kbd> để mở lại hộp thoại Tạo nhanh</div>

<div class="backdrop" id="bd">
  <div class="dlg">
    <div class="dh">
      <div class="seg" id="seg">
        <button class="on" data-t="task">☑️ Nhiệm vụ</button>
        <button data-t="note">📝 Ghi chú</button>
        <button data-t="event">📅 Lịch hẹn</button>
        <button data-t="ref">🔗 Tài liệu</button>
      </div>
    </div>
    <div class="body">
      <input class="title" id="title" placeholder="Nhập tên việc cần làm..." autofocus>

      <div id="f-task">
        <div class="row">
          <div class="field"><label>Hạn chót</label><input type="date" value="2026-09-28"></div>
          <div class="field"><label>Ưu tiên</label><div class="pr" id="pr">
            <button data-p="LOW">LOW</button><button data-p="MEDIUM" class="on">MEDIUM</button><button data-p="HIGH">HIGH</button><button data-p="URGENT">URGENT</button>
          </div></div>
        </div>
      </div>

      <div id="f-event" style="display:none">
        <div class="row">
          <div class="field"><label>Bắt đầu</label><input type="datetime-local" value="2026-09-28T14:00"></div>
          <div class="field"><label>Kết thúc</label><input type="datetime-local" value="2026-09-28T15:30"></div>
        </div>
      </div>

      <div id="f-ref" style="display:none">
        <div class="field" style="margin-bottom:10px"><label>URL</label><input id="url" placeholder="https://..." value="https://docs.nestjs.com"></div>
        <div class="urlprev show" id="prev"><div class="ic">🔗</div><div><b>NestJS Official Documentation</b><span>docs.nestjs.com</span></div></div>
      </div>

      <div class="row">
        <div class="field"><label>Không gian</label><select>
          <option>📥 Hộp nhận tự do (Inbox)</option>
          <option selected>🎓 Đồ án tốt nghiệp</option>
          <option>💼 Việc Freelance</option>
          <option>🇬🇧 Tiếng Anh TOEIC</option>
        </select></div>
      </div>
    </div>
    <div class="foot">
      <span class="hintf">Enter để lưu · <kbd>Esc</kbd> để huỷ</span>
      <div class="acts"><button class="cancel">Hủy</button><button class="save">Lưu ngay ↵</button></div>
    </div>
  </div>
</div>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var bd=$('#bd'),title=$('#title'),PH={task:'Nhập tên việc cần làm...',note:'Tiêu đề ghi chú...',event:'Tên lịch hẹn...',ref:'Tiêu đề tài liệu (tuỳ chọn)...'};
$$('#seg button').forEach(function(b){b.onclick=function(){
 $$('#seg button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
 ['task','event','ref'].forEach(function(t){var el=$('#f-'+t);if(el)el.style.display=(t===b.dataset.t)?'':'none'});
 title.placeholder=PH[b.dataset.t];title.focus();
}});
$$('#pr button').forEach(function(b){b.onclick=function(){$$('#pr button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}});
function close(){bd.style.display='none'}
$('.cancel').onclick=close;
$('.save').onclick=close;
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){close();return}
 if(e.key==='Enter'&&document.activeElement!==$('#url')){close();return}
 if((e.key==='c'||e.key==='C')&&bd.style.display==='none'){bd.style.display='flex';title.focus()}
});
})();
</script>
</body></html>
