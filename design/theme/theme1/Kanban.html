<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban · Đồ án tốt nghiệp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f9fa;--col:#f1f3f4;--card:#fff;--bd:#dadce0;--tx:#202124;--tx2:#5f6368;--blue:#1a73e8;--blue-bg:#e8f0fe;--amber:#b06000;--amber-bg:#fef7e0;--red:#c5221f;--red-bg:#fce8e6;--green:#188038;--sh:0 1px 2px rgba(60,64,67,.12),0 1px 3px rgba(60,64,67,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--col:#292a2d;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blue-bg:#283142;--amber:#fdd663;--amber-bg:#3d3520;--red:#f28b82;--red-bg:#42282a;--green:#81c995;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#202124;--col:#292a2d;--card:#2d2e31;--bd:#3c4043;--tx:#e8eaed;--tx2:#9aa0a6;--blue:#8ab4f8;--blue-bg:#283142;--amber:#fdd663;--amber-bg:#3d3520;--red:#f28b82;--red-bg:#42282a;--green:#81c995;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{flex:none;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:700;margin-right:auto;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:0 10px;height:36px;width:260px;max-width:100%}
.search:focus-within{border-color:var(--blue);background:var(--card)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.sel{height:36px;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:0 8px;cursor:pointer}
.add{height:36px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;padding:0 16px;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .add{color:#202124}
.add:hover{filter:brightness(.94)}
.wrap{flex:1;min-height:0;overflow:auto;padding:20px 24px}
.board{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:16px;align-items:start;min-height:100%}
.colm{background:var(--col);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:200px;min-width:300px;transition:background .15s,border-color .15s}
.colm.over{border-color:var(--blue);background:var(--blue-bg)}
.ch{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-size:12px;letter-spacing:.05em}
.ch i{width:8px;height:8px;border-radius:50%}
.ch b{font-weight:700}.ch span{color:var(--tx2);font-weight:500}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:12px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;z-index:1}
.card:hover{border-color:#aecbfa;box-shadow:0 2px 8px rgba(60,64,67,.15);z-index:2}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue),0 4px 14px rgba(26,115,232,.22);z-index:3}
.card.dragging{opacity:.4}
/* backdrop for side-peek drawer */
.backdrop2{position:fixed;inset:0;background:rgba(32,33,36,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s;z-index:9}
body.peek .backdrop2{opacity:1;visibility:visible;transition:opacity .28s ease}
.row1{display:flex;gap:8px;align-items:flex-start}
.grip{flex:none;color:#9aa0a6;cursor:grab;letter-spacing:-2px;font-size:14px;line-height:20px;user-select:none;width:12px}
.title{font-weight:600;font-size:14px;line-height:1.4}
.done .title{color:var(--tx2);text-decoration:line-through;font-weight:500}
.row2{display:flex;align-items:center;gap:8px;margin:9px 0 0 20px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;border-radius:99px;padding:1px 9px;display:inline-flex;align-items:center;gap:5px}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.URGENT{color:var(--red);background:var(--red-bg)}.HIGH{color:var(--amber);background:var(--amber-bg)}.MEDIUM{color:var(--blue);background:var(--blue-bg)}.LOW{color:var(--tx2);background:var(--col);border:1px solid var(--bd)}
.due{font-size:12px;color:var(--tx2)}
.mat{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 20px;padding-top:10px;border-top:1px dashed var(--bd)}
.mp{font-size:12px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;white-space:nowrap}
.mp.n{color:var(--tx2);border-style:dashed;background:transparent}
.more{width:100%;border:1px dashed var(--bd);background:transparent;border-radius:8px;padding:8px;color:var(--tx2);cursor:pointer}
.more:hover{background:var(--card)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--card);border-left:1px solid var(--bd);box-shadow:-8px 0 24px rgba(60,64,67,.18);transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;display:flex;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.peek .drawer{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.dh{padding:16px 20px 14px;border-bottom:1px solid var(--bd)}
.dtop{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--tx2);text-transform:uppercase;margin-bottom:8px}
.x{border:0;background:transparent;width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:16px}
.x:hover{background:var(--bg)}
.dh h2{margin:0 0 8px;font-size:17px;line-height:1.35}
.db{flex:1;overflow-y:auto;padding:16px 20px 24px}
.sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:0 0 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tb{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:3px 12px;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.tb.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:600}
.note{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;background:var(--bg);margin-bottom:22px}
.note h3{margin:0 0 4px;font-size:15px}
.tag{display:inline-block;font-size:12px;color:var(--blue);background:var(--blue-bg);border-radius:99px;padding:0 9px;font-weight:500;margin-bottom:10px}
.note h4{margin:10px 0 4px;font-size:13.5px}
.note p{margin:0 0 8px;font-size:13.5px;color:var(--tx2)}
.note ul{margin:0 0 8px;padding-left:18px;font-size:13.5px;color:var(--tx2)}
.note b{color:var(--tx)}
code{font:12px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:0 4px;color:var(--tx)}
pre{margin:0 0 4px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;overflow-x:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx)}
.lnk{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.lnk:hover{border-color:var(--blue)}
.lnk .ic{width:34px;height:34px;border-radius:8px;background:var(--blue-bg);display:grid;place-items:center;flex:none}
.lnk b{display:block;font-size:13.5px}.lnk span{font-size:12px;color:var(--tx2)}
.lnk div{flex:1;min-width:0}
.emp{color:var(--tx2);font-size:13px;border:1px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;margin-bottom:16px}
@media (max-width:700px){.toolbar{padding:12px 16px}.wrap{padding:16px}.search{width:100%}}
/* app shell */
body{flex-direction:row}
aside{width:240px;flex:none;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:4px 8px 16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.sec2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);padding:14px 10px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.item:hover{background:var(--bg)}
.item.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.item small{margin-left:auto;background:var(--red-bg);color:var(--red);border-radius:99px;padding:0 7px;font-weight:600;font-size:11px}
.item i{width:8px;height:8px;border-radius:50%;flex:none}
.grow{flex:1}
.storage{padding:10px 10px 4px}
.storage .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:6px}
.sbar{height:5px;border-radius:99px;background:var(--bd);overflow:hidden}
.sbar i{display:block;height:100%;width:68%;background:var(--blue);border-radius:99px}
.appmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.apphead{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 18px}
.crumb{font-size:13px;color:var(--tx2);white-space:nowrap}
.crumb b{color:var(--tx);font-weight:600}
.omni{margin:0 auto;width:380px;max-width:32vw;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;height:36px;padding:0 10px}
.omni input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;color:inherit}
kbd{font-size:11px;color:var(--tx2);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;background:var(--card)}
.hr{display:flex;align-items:center;gap:10px;flex:none}
.qc{height:34px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;padding:0 14px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-size:13px}
:root[data-theme="dark"] .qc{color:#202124}
.qc kbd{background:rgba(255,255,255,.18);border-color:transparent;color:inherit}
.ibtn{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);cursor:pointer;flex:none;border:0;background:transparent}
.ibtn:hover{background:var(--bg)}
.dotr{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#ea4335;border:1.5px solid var(--card)}
.avwrap{position:relative;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8ab4f8,#1a73e8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.onl{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#34a853;border:2px solid var(--card)}
.toolbar{flex:none;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (max-width:1000px){aside{display:none}.omni{max-width:none;width:auto;flex:1}}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="dot"></span>StudyWork</div>
  <div class="item">🏠 Tổng quan</div>
  <div class="item">📥 Hộp nhận tự do<small>24</small></div>
  <div class="sec2"><span>Không gian của tôi</span><span>＋</span></div>
  <div class="item on">🎓 Đồ án tốt nghiệp</div>
  <div class="item">💼 Việc Freelance</div>
  <div class="item">🇬🇧 Tiếng Anh TOEIC</div>
  <div class="sec2">Chế độ xem</div>
  <div class="item on" style="background:var(--blue-bg);color:var(--blue)">📋 Bảng việc Kanban</div>
  <div class="item">📅 Lịch &amp; Thời khoá biểu</div>
  <div class="item">🗺️ Bản đồ tư duy</div>
  <div class="grow"></div>
  <div class="storage"><div class="lb"><span>Bộ nhớ</span><span>68%</span></div><div class="sbar"><i></i></div></div>
  <div class="item">🗑️ Thùng rác</div>
</aside>
<main class="appmain">
  <header class="apphead">
    <div class="crumb">🎓 Đồ án tốt nghiệp <span style="opacity:.5">/</span> <b>Bảng Kanban</b></div>
    <label class="omni"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="Tìm kiếm bài học, việc cần làm, tài liệu..." aria-label="Tìm kiếm"><kbd>Ctrl K</kbd></label>
    <div class="hr">
      <button class="qc">+ Tạo nhanh<kbd>C</kbd></button>
      <button class="ibtn" aria-label="Thông báo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dotr"></span></button>
      <div class="avwrap"><div class="av">VH</div><span class="onl"></span></div>
    </div>
  </header>
  <div class="toolbar">
    <h1>🎓 Đồ án tốt nghiệp</h1>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Tìm công việc..." aria-label="Tìm công việc"></label>
    <select class="sel" id="pf" aria-label="Lọc ưu tiên"><option value="">Mọi ưu tiên</option><option>URGENT</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
    <button class="add">+ Thêm công việc</button>
  </div>
  <div class="wrap"><div class="board" id="board"></div></div>
</main>

<div class="backdrop2" id="backdrop2"></div>
<aside class="drawer" id="drawer" aria-label="Side peek">
  <div class="dh">
    <div class="dtop"><span>Xem nhanh · Tài liệu liên quan</span><button class="x" id="close" aria-label="Đóng">✕</button></div>
    <h2 id="dt"></h2>
    <div class="row2" style="margin:0" id="dm"></div>
  </div>
  <div class="db" id="db"></div>
</aside>

<script>
(function(){
var COLS=[['todo','CẦN LÀM','TODO','#80868b',0],['doing','ĐANG LÀM','IN PROGRESS','#1a73e8',0],['done','ĐÃ XONG','DONE','#34a853',5]];
var N={
 orm:{t:'Tóm tắt chương 2 - Lý thuyết ORM',g:'#ORM',h:'<h4>Object-Relational Mapping</h4><p><b>ORM</b> ánh xạ bảng trong CSDL sang đối tượng trong code, giúp truy vấn bằng ngôn ngữ lập trình thay cho SQL thuần.</p><ul><li>Ưu điểm: ít SQL thủ công, an toàn kiểu dữ liệu</li><li>Nhược điểm: truy vấn phức tạp khó tối ưu</li><li>Prisma dùng file <code>schema.prisma</code> và tự sinh client</li></ul><h4>Ví dụ</h4><pre>model Note {\n  id    String @id @default(uuid())\n  title String\n}</pre>'},
 hyb:{t:'Kiến trúc Hybrid Object',g:'#Architecture',h:'<h4>Một bảng cho mọi thực thể</h4><p>Note, Task và Reference dùng chung bảng <code>objects</code>; phần riêng của từng loại nằm trong cột JSONB.</p><ul><li>Quan hệ lưu ở bảng <code>relations</code> với kiểu có nhãn</li><li>Ví dụ: <code>DEPENDS_ON</code>, <code>REFERENCES</code></li></ul><pre>model Object {\n  id    String @id\n  type  ObjectType\n  props Json\n}</pre>'},
 jwt:{t:'JWT &amp; Refresh Token',g:'#Auth',h:'<h4>Cặp token</h4><p>Access token sống ngắn; refresh token lưu trong cookie <code>httpOnly</code>.</p><ul><li>Xoay vòng refresh token sau mỗi lần dùng</li><li>Thu hồi token khi đăng xuất</li></ul>'}
};
var L={nest:['NestJS Official Documentation','docs.nestjs.com'],pri:['Prisma Docs - Data Modeling','prisma.io/docs'],jwt:['Giới thiệu JSON Web Token','jwt.io/introduction']};
var T=[
 {id:1,c:'todo',t:'Cài đặt xác thực JWT trong NestJS',p:'URGENT',d:'30/09',n:['jwt'],l:['nest','jwt']},
 {id:2,c:'todo',t:'Vẽ ERD cho tài liệu thiết kế',p:'HIGH',d:'05/10',n:['hyb'],l:[]},
 {id:3,c:'todo',t:'Viết unit test cho AuthService',p:'MEDIUM',d:'07/10',n:['jwt'],l:['nest']},
 {id:4,c:'todo',t:'Soạn slide bảo vệ đồ án',p:'LOW',d:'20/10',n:[],l:[]},
 {id:5,c:'doing',t:'Viết mã nguồn Prisma Schema',p:'HIGH',d:'28/09',n:['hyb','orm'],l:['pri']},
 {id:6,c:'doing',t:'Hoàn thiện chương 2 - Cơ sở lý thuyết',p:'MEDIUM',d:'02/10',n:['orm'],l:['pri']},
 {id:7,c:'done',t:'Đọc tài liệu Prisma Migrate',p:'LOW',d:'20/09',n:['orm'],l:['pri']},
 {id:8,c:'done',t:'Khởi tạo repo &amp; cấu hình CI',p:'MEDIUM',d:'15/09',n:[],l:['nest']},
 {id:9,c:'done',t:'Viết 01_Research.md',p:'HIGH',d:'10/09',n:['hyb'],l:[]}
];
var sel=5,tab=0,$=function(i){return document.getElementById(i)};
function get(id){return T.filter(function(x){return x.id===id})[0]}
function card(x){
 var m='';
 if(x.n.length)m+='<span class="mp">📝 '+x.n.length+' Ghi chú đính kèm</span>';
 if(x.l.length)m+='<span class="mp">🔗 '+x.l.length+' Link tài liệu</span>';
 if(!m)m='<span class="mp n">＋ Đính kèm tài liệu</span>';
 return '<div class="card'+(x.c==='done'?' done':'')+(x.id===sel?' sel':'')+'" draggable="true" data-id="'+x.id+'"><div class="row1"><span class="grip" title="Kéo để di chuyển">⋮⋮</span><div class="title">'+x.t+'</div></div><div class="row2"><span class="pill '+x.p+'">'+x.p+'</span><span class="due">📅 '+x.d+'</span></div><div class="mat">'+m+'</div></div>';
}
function render(){
 var q=$('q').value.trim().toLowerCase(),pf=$('pf').value,h='';
 COLS.forEach(function(c){
  var all=T.filter(function(x){return x.c===c[0]});
  var vis=all.filter(function(x){return (!pf||x.p===pf)&&(!q||x.t.toLowerCase().indexOf(q)>-1)});
  h+='<section class="colm" data-c="'+c[0]+'"><div class="ch"><i style="background:'+c[3]+'"></i><b>'+c[1]+'</b><span>('+c[2]+' - '+(all.length+c[4])+')</span></div>'+vis.map(card).join('')+(c[4]?'<button class="more">Xem thêm '+c[4]+' công việc đã xong</button>':'')+'</section>';
 });
 $('board').innerHTML=h;
}
function drawer(){
 var x=get(sel);if(!x){document.body.classList.remove('peek');return}
 $('dt').innerHTML=x.t;
 var st=COLS.filter(function(c){return c[0]===x.c})[0];
 $('dm').innerHTML='<span class="pill '+x.p+'">'+x.p+'</span><span class="due">📅 '+x.d+'</span><span class="due">· '+st[1]+'</span>';
 var b='<div class="sec">Ghi chú đính kèm ('+x.n.length+')</div>';
 if(x.n.length){
  if(tab>=x.n.length)tab=0;
  b+='<div class="tabs">'+x.n.map(function(k,i){return '<button class="tb'+(i===tab?' on':'')+'" data-tab="'+i+'">📝 '+N[k].t.split(' - ').pop().replace('Lý thuyết ','')+'</button>'}).join('')+'</div>';
  var n=N[x.n[tab]];b+='<div class="note"><h3>📝 '+n.t+'</h3><span class="tag">'+n.g+'</span>'+n.h+'</div>';
 }else b+='<div class="emp">Chưa có ghi chú nào được đính kèm.</div>';
 b+='<div class="sec">Link tài liệu ('+x.l.length+')</div>';
 b+=x.l.length?x.l.map(function(k){return '<div class="lnk"><div class="ic">🔗</div><div><b>'+L[k][0]+'</b><span>'+L[k][1]+'</span></div><span>↗</span></div>'}).join(''):'<div class="emp">Chưa có link tài liệu.</div>';
 $('db').innerHTML=b;
}
function open(id){if(sel===id&&document.body.classList.contains('peek')){close();return}sel=id;tab=0;document.body.classList.add('peek');render();drawer()}
function close(){document.body.classList.remove('peek');sel=null;render()}
var B=$('board');
B.addEventListener('click',function(e){var c=e.target.closest('.card');if(c)open(+c.dataset.id)});
var drag=null;
B.addEventListener('dragstart',function(e){var c=e.target.closest('.card');if(!c)return;drag=+c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(drag));c.classList.add('dragging')});
B.addEventListener('dragend',function(){drag=null;render()});
B.addEventListener('dragover',function(e){var c=e.target.closest('.colm');if(!c||drag===null)return;e.preventDefault();Array.prototype.forEach.call(B.querySelectorAll('.colm'),function(x){x.classList.toggle('over',x===c)})});
B.addEventListener('drop',function(e){var c=e.target.closest('.colm');if(!c||drag===null)return;e.preventDefault();get(drag).c=c.dataset.c;drag=null;render();if(sel)drawer()});
$('db').addEventListener('click',function(e){var t=e.target.closest('.tb');if(t){tab=+t.dataset.tab;drawer()}});
$('close').onclick=close;
$('backdrop2').addEventListener('click',close);
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
$('q').oninput=render;$('pf').onchange=render;
render();drawer();document.body.classList.add('peek');
})();
</script>
